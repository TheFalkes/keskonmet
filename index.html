<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ciné du foyer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ciné">
<meta name="theme-color" content="#7aa7ff">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --text:#14161f; --text2:rgba(20,22,31,.58);
  --glass:rgba(255,255,255,.42); --glass-strong:rgba(255,255,255,.62);
  --stroke:rgba(255,255,255,.75); --stroke-soft:rgba(255,255,255,.4);
  --shadow:0 10px 30px rgba(50,60,120,.16);
  --hi:inset 0 1.5px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.25);
  --accent:#0a84ff; --green:#30d158; --orange:#ff9f0a; --red:#ff453a; --purple:#bf5af2;
  --bg1:#cfe3ff; --bg2:#ffd9ec; --bg3:#d9ffe9;
  --blob1:#6aa8ff; --blob2:#ff8fc7; --blob3:#7cf0b6;
  --pill:rgba(255,255,255,.85);
}
:root[data-theme="dark"]{
  --text:#f4f5fa; --text2:rgba(244,245,250,.6);
  --glass:rgba(40,42,60,.42); --glass-strong:rgba(55,58,82,.6);
  --stroke:rgba(255,255,255,.22); --stroke-soft:rgba(255,255,255,.1);
  --shadow:0 12px 32px rgba(0,0,0,.45);
  --hi:inset 0 1.5px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(255,255,255,.04);
  --accent:#4da3ff;
  --bg1:#0c1022; --bg2:#1c0f24; --bg3:#0a1c1a;
  --blob1:#2b5cff; --blob2:#a02bd6; --blob3:#0aa88a;
  --pill:rgba(255,255,255,.2);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  font-family:var(--font);color:var(--text);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;background:var(--bg1)}
body{position:fixed;inset:0;width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}

/* Fond */
.bg{position:fixed;inset:0;overflow:hidden;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));transition:background .5s}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;transition:background .5s}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:var(--blob1)}
.b2{width:50vmax;height:50vmax;right:-18vmax;top:25%;background:var(--blob2)}
.b3{width:55vmax;height:55vmax;left:5%;bottom:-28vmax;background:var(--blob3)}
:root[data-theme="dark"] .blob{opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .b1{animation:drift 22s ease-in-out infinite alternate}
  .b2{animation:drift 28s ease-in-out infinite alternate-reverse}
  .b3{animation:drift 25s ease-in-out infinite alternate}
}
@keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}

/* Verre */
.glass{background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--hi),var(--shadow);
  -webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);position:relative}

/* Mise en page */
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:720px;margin:0 auto;
  padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:flex-end;justify-content:space-between;padding:18px 20px 6px}
header h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.8px;line-height:1.05}
header p{margin:4px 0 0;font-size:14px;color:var(--text2);font-weight:500}
.hbtns{display:flex;gap:10px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
.round:active{transform:scale(.88)}
.round svg{width:22px;height:22px}

.controls{display:flex;gap:10px;padding:12px 20px 8px;align-items:center}
.seg{flex:1;display:flex;border-radius:999px;padding:4px;position:relative;height:44px}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;
  background:var(--pill);box-shadow:0 2px 8px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.seg[data-v="serie"] .thumb{transform:translateX(100%)}
.seg button{flex:1;position:relative;z-index:1;font-weight:650;font-size:15px;border-radius:999px;color:var(--text2);transition:color .25s}
.seg button.on{color:var(--text)}
.sort{height:44px;padding:0 16px;border-radius:999px;font-weight:650;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap;transition:transform .2s}
.sort:active{transform:scale(.94)}
.sort svg{width:16px;height:16px}

#list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px 20px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;
  scrollbar-width:none;mask-image:linear-gradient(#000 calc(100% - 130px),transparent);-webkit-mask-image:linear-gradient(#000 calc(100% - 130px),transparent)}
#list::-webkit-scrollbar{display:none}
#list.enter .card{animation:rise .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}

.card{border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;flex:none}
.card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.card h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.3px;line-height:1.25;word-break:break-word;transition:opacity .3s}
.card.seen h3{opacity:.45;text-decoration:line-through;text-decoration-thickness:1.5px}
.del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text2);flex:none;margin:-4px -6px 0 0}
.del svg{width:16px;height:16px}
.del:active{background:rgba(255,69,58,.2);color:var(--red)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px 0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:650;
  background:var(--glass-strong);border:1px solid var(--stroke-soft);color:var(--text2);
  transition:all .3s cubic-bezier(.3,1.4,.5,1)}
.chip svg{width:16px;height:16px}
.chip:active{transform:scale(.92)}
.chip.vu.on{background:var(--green);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(48,209,88,.45)}
.chip.cours.on{background:var(--orange);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(255,159,10,.45)}
.chip.strem.on{background:var(--purple);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(191,90,242,.45)}

.empty{margin:auto;text-align:center;color:var(--text2);padding:40px 20px;font-weight:500;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}

/* Bouton + */
#fab{position:fixed;right:max(20px,calc(50% - 340px));bottom:calc(98px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;
  display:grid;place-items:center;z-index:5;background:var(--accent);border:1px solid rgba(255,255,255,.5);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 10px 26px rgba(10,132,255,.5);color:#fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
#fab:active{transform:scale(.88) rotate(90deg)}
#fab svg{width:28px;height:28px}

/* Dock flottant */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  display:flex;padding:6px;border-radius:999px;width:min(calc(100% - 32px),440px)}
#dock .ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:999px;background:var(--pill);
  box-shadow:0 3px 12px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.8);transition:transform .5s cubic-bezier(.3,1.25,.45,1),width .5s cubic-bezier(.3,1.25,.45,1)}
#dock button{flex:1;position:relative;z-index:1;height:52px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:11.5px;font-weight:650;color:var(--text2);transition:color .3s}
#dock button.on{color:var(--accent)}
#dock button svg{width:22px;height:22px}

/* Modales */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,30,.35);opacity:0;pointer-events:none;transition:opacity .3s;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;z-index:21;width:min(100%,560px);transform:translate(-50%,110%);
  border-radius:32px 32px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));transition:transform .5s cubic-bezier(.25,1.1,.4,1);
  background:var(--glass-strong)}
.sheet.open{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--text2);opacity:.4;margin:0 auto 14px}
.sheet h2{margin:0 0 14px;font-size:24px;font-weight:800;letter-spacing:-.5px}
.field{width:100%;height:52px;border-radius:16px;border:1px solid var(--stroke);background:var(--glass);padding:0 16px;font-size:17px;outline:none;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.06)}
.field:focus{border-color:var(--accent)}
.lbl{font-size:13px;font-weight:650;color:var(--text2);margin:16px 4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:calc(50% - 4px);height:46px;border-radius:14px;font-weight:650;font-size:15px;background:var(--glass);border:1px solid var(--stroke-soft);transition:all .25s}
.opt.on{background:var(--accent);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(10,132,255,.4)}
.opt:active{transform:scale(.95)}
.primary{width:100%;height:54px;margin-top:18px;border-radius:18px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 8px 22px rgba(10,132,255,.45);transition:transform .2s}
.primary:active{transform:scale(.97)}
.primary:disabled{opacity:.4}
.ghost{width:100%;height:48px;margin-top:8px;border-radius:16px;font-weight:650;font-size:16px;color:var(--accent)}

.result{margin-top:18px;border-radius:24px;padding:22px 18px;text-align:center;min-height:120px;display:flex;flex-direction:column;justify-content:center;gap:6px;background:var(--glass)}
.result small{color:var(--text2);font-weight:600;font-size:13px}
.result strong{font-size:26px;letter-spacing:-.6px;line-height:1.2;word-break:break-word}
.result.spin strong{opacity:.55;filter:blur(1.2px)}
.result.pop strong{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}

.setrow{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke-soft);font-weight:650;font-size:16px}
.switch{width:52px;height:32px;border-radius:999px;background:rgba(120,120,128,.35);position:relative;transition:background .3s;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);font-weight:600;margin:10px 4px 0}
.dot{width:9px;height:9px;border-radius:50%;background:var(--text2)}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)} .dot.err{background:var(--red)} .dot.wait{background:var(--orange)}
.hint{font-size:12.5px;color:var(--text2);margin:8px 4px 0;line-height:1.45}

#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-140%);z-index:40;padding:11px 18px;border-radius:999px;font-weight:650;font-size:14px;
  transition:transform .45s cubic-bezier(.3,1.3,.5,1);max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="app">
  <header>
    <div><h1 id="title">Alexis</h1><p id="sub"></p></div>
    <div class="hbtns">
      <button class="round glass" id="btnRand" aria-label="Aléatoire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1.2" fill="currentColor"/></svg></button>
      <button class="round glass" id="btnSet" aria-label="Paramètres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
  </header>
  <div class="controls">
    <div class="seg glass" id="seg" data-v="film"><div class="thumb"></div>
      <button data-t="film" class="on">Films</button><button data-t="serie">Séries</button></div>
    <button class="sort glass" id="btnSort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span id="sortLbl">Récents</span></button>
  </div>
  <div id="list"></div>
</div>

<button id="fab" aria-label="Ajouter"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav id="dock" class="glass">
  <div class="ind" id="ind"></div>
  <button data-p="0"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z"/></svg>Alexis</button>
  <button data-p="1"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z"/></svg>Marlène</button>
  <button data-p="2"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6z"/></svg>Ayden</button>
  <button data-p="3"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8.5" cy="9" r="3"/><circle cx="16" cy="10" r="2.5"/><path d="M2 19c0-3 2.8-5 6.5-5s6.5 2 6.5 5zM14.5 14.2c3.4-.3 7.5.8 7.5 4.8h-5.5c0-2-.8-3.4-2-4.8z"/></svg>Famille</button>
</nav>

<!-- Ajout -->
<div class="scrim" id="scrimAdd"></div>
<div class="sheet glass" id="sheetAdd">
  <div class="grab"></div>
  <h2 id="addTitle">Ajouter un film</h2>
  <input class="field" id="addInput" type="text" placeholder="Titre" autocomplete="off" enterkeyhint="done">
  <button class="primary" id="addOk" disabled>Ajouter</button>
  <button class="ghost" data-close>Annuler</button>
</div>

<!-- Aléatoire -->
<div class="scrim" id="scrimRand"></div>
<div class="sheet glass" id="sheetRand">
  <div class="grab"></div>
  <h2>Aléatoire</h2>
  <div class="lbl" style="margin-top:0">Liste</div>
  <div class="row" id="rndP">
    <button class="opt" data-p="0">Alexis</button><button class="opt" data-p="1">Marlène</button>
    <button class="opt" data-p="2">Ayden</button><button class="opt" data-p="3">Famille</button>
  </div>
  <div class="lbl">Type</div>
  <div class="row" id="rndT"><button class="opt" data-t="film">Film</button><button class="opt" data-t="serie">Série</button></div>
  <div class="result glass" id="rndRes"><small>Prêt ?</small><strong>Choisis une liste puis tire au sort</strong></div>
  <button class="primary" id="rndGo">Tirer au sort</button>
  <button class="ghost" id="rndSeen" style="display:none">Marquer comme vu</button>
  <button class="ghost" data-close>Fermer</button>
</div>

<!-- Paramètres -->
<div class="scrim" id="scrimSet"></div>
<div class="sheet glass" id="sheetSet">
  <div class="grab"></div>
  <h2>Paramètres</h2>
  <div class="setrow"><span>Mode sombre</span><button class="switch" id="swDark" aria-label="Mode sombre"></button></div>
  <div class="lbl">Synchronisation</div>
  <input class="field" id="fbUrl" type="url" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://mon-projet-default-rtdb.firebaseio.com">
  <div class="status"><span class="dot" id="syncDot"></span><span id="syncTxt"></span></div>
  <div class="hint">Colle ici l’adresse de ta base Firebase Realtime Database (à faire une fois par appareil, sauf si elle est écrite dans le code).</div>
  <button class="primary" id="fbSave">Enregistrer</button>
  <button class="ghost" data-close>Fermer</button>
</div>

<div id="toast" class="glass"></div>

<script>
/* ================= CONFIG =================
   Colle ici l'URL de ta Firebase Realtime Database pour que tous les
   appareils se connectent automatiquement. Exemple :
   const FIREBASE_URL = "https://keskonmet-default-rtdb.europe-west1.firebasedatabase.app/";
*/
const FIREBASE_URL = "https://keskonmet-default-rtdb.europe-west1.firebasedatabase.app/";
/* ========================================= */

const PROFILES = ["Alexis","Marlène","Ayden","Famille"];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const ls = {
  get:(k,d)=>{try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};
const cleanUrl = u => (u||"").trim().replace(/\.json.*$/,"").replace(/\/+$/,"");
let dbUrl = cleanUrl(FIREBASE_URL) || cleanUrl(ls.get("cine_fb",""));

const state = {
  items: {},
  p: parseInt(ls.get("cine_p","0"))||0,
  t: ls.get("cine_t","film"),
  sort: ls.get("cine_sort","recent"),
  sync: dbUrl ? "wait" : "local"
};
try{ state.items = JSON.parse(ls.get("cine_items","{}"))||{} }catch(e){}
let animate = true;

/* ---------- Thème ---------- */
function applyTheme(){
  const saved = ls.get("cine_theme","");
  const dark = saved ? saved==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#swDark").classList.toggle("on",dark);
  document.querySelector('meta[name="theme-color"]').content = dark ? "#0c1022" : "#cfe3ff";
}
$("#swDark").onclick = () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  ls.set("cine_theme",dark?"dark":"light"); applyTheme();
};

/* ---------- Icônes ---------- */
const ICON = {
  vu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  cours:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
  strem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="3"/><path d="M8 21h8M12 17v4"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};
const esc = s => s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- Données & synchro ---------- */
function persist(){ ls.set("cine_items",JSON.stringify(state.items)); }
let es = null, retry = null;

function setSync(s){ state.sync = s; renderSync(); }
function renderSync(){
  const m = {local:["","Mode local : pas de synchronisation"],wait:["wait","Connexion…"],ok:["ok","Synchronisé en temps réel"],err:["err","Hors ligne, nouvelle tentative…"]}[state.sync];
  $("#syncDot").className = "dot "+m[0]; $("#syncTxt").textContent = m[1];
}

function connect(){
  if(es){es.close();es=null}
  clearTimeout(retry);
  if(!dbUrl){ setSync("local"); return }
  setSync("wait");
  try{ es = new EventSource(dbUrl+"/items.json"); }catch(e){ setSync("err"); return }
  es.addEventListener("put",e=>{
    const {path,data} = JSON.parse(e.data);
    applyRemote(path,data,false); setSync("ok");
  });
  es.addEventListener("patch",e=>{
    const {path,data} = JSON.parse(e.data);
    applyRemote(path,data,true); setSync("ok");
  });
  es.addEventListener("auth_revoked",()=>setSync("err"));
  es.onerror = () => {
    setSync("err");
    if(es && es.readyState===2){ clearTimeout(retry); retry=setTimeout(connect,4000) }
  };
}
function applyRemote(path,data,merge){
  const parts = path.split("/").filter(Boolean);
  if(parts.length===0){
    if(merge){ for(const k in data){ if(data[k]===null) delete state.items[k]; else state.items[k]=data[k]; } }
    else state.items = data || {};
  } else if(parts.length===1){
    const id = parts[0];
    if(data===null) delete state.items[id];
    else if(merge) state.items[id] = Object.assign({},state.items[id],data);
    else state.items[id] = data;
  } else {
    const [id,f] = parts;
    if(!state.items[id]) state.items[id] = {};
    if(data===null) delete state.items[id][f]; else state.items[id][f] = data;
  }
  persist(); render();
}
function remote(method,id,body){
  if(!dbUrl) return;
  fetch(`${dbUrl}/items/${id}.json`,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined})
    .then(r=>{ if(!r.ok) throw 0 })
    .catch(()=>toast("Échec de l’envoi. Vérifie la connexion."));
}
function addItem(title){
  const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const it = {title,p:state.p,t:state.t,vu:false,cours:false,strem:false,ts:Date.now()};
  state.items[id] = it; persist(); render(); remote("PUT",id,it);
}
function patchItem(id,patch){
  if(!state.items[id]) return;
  Object.assign(state.items[id],patch); persist(); render(); remote("PATCH",id,patch);
}
function delItem(id){ delete state.items[id]; persist(); render(); remote("DELETE",id); }

/* ---------- Rendu ---------- */
function inView(){
  const arr = Object.entries(state.items).filter(([,i])=>i&&i.p===state.p&&i.t===state.t);
  arr.sort((a,b)=> state.sort==="az"
    ? a[1].title.localeCompare(b[1].title,"fr",{sensitivity:"base"})
    : (b[1].ts||0)-(a[1].ts||0));
  return arr;
}
function render(){
  $("#title").textContent = PROFILES[state.p];
  const all = Object.values(state.items).filter(i=>i&&i.p===state.p&&i.t===state.t);
  const seen = all.filter(i=>i.vu).length;
  const word = state.t==="film"?"film":"série";
  $("#sub").textContent = all.length ? `${all.length-seen} à voir · ${seen} vu${seen>1?"s":""}` : "Aucun titre";
  $("#sortLbl").textContent = state.sort==="az" ? "A → Z" : "Récents";
  $("#seg").dataset.v = state.t;
  $$("#seg button").forEach(b=>b.classList.toggle("on",b.dataset.t===state.t));
  $$("#dock button").forEach(b=>b.classList.toggle("on",+b.dataset.p===state.p));
  moveInd();

  const list = $("#list"), arr = inView();
  list.classList.toggle("enter",animate);
  if(!arr.length){
    list.innerHTML = `<div class="empty"><b>Liste vide</b>Appuie sur + pour ajouter ${state.t==="film"?"un film":"une série"} à la liste de ${esc(PROFILES[state.p])}.</div>`;
  } else {
    list.innerHTML = arr.map(([id,i],n)=>`
      <div class="card glass${i.vu?" seen":""}" data-id="${id}" style="animation-delay:${Math.min(n,8)*35}ms">
        <div class="top"><h3>${esc(i.title)}</h3><button class="del" data-a="del" aria-label="Supprimer">${ICON.del}</button></div>
        <div class="chips">
          <button class="chip vu${i.vu?" on":""}" data-a="vu">${ICON.vu}Vu</button>
          <button class="chip cours${i.cours?" on":""}" data-a="cours">${ICON.cours}En cours</button>
          <button class="chip strem${i.strem?" on":""}" data-a="strem">${ICON.strem}Stremio</button>
        </div>
      </div>`).join("");
  }
  animate = false;
}
function moveInd(){
  const b = $(`#dock button[data-p="${state.p}"]`), ind = $("#ind");
  if(!b) return;
  ind.style.width = b.offsetWidth+"px";
  ind.style.transform = `translateX(${b.offsetLeft}px)`;
}
addEventListener("resize",moveInd);

/* ---------- Interactions ---------- */
$("#list").addEventListener("click",e=>{
  const btn = e.target.closest("[data-a]"); if(!btn) return;
  const id = btn.closest(".card").dataset.id, it = state.items[id], a = btn.dataset.a;
  if(a==="del"){ if(confirm(`Supprimer « ${it.title} » ?`)) delItem(id); return }
  if(a==="vu"){ patchItem(id, it.vu ? {vu:false} : {vu:true,cours:false}); }
  if(a==="cours"){ patchItem(id, it.cours ? {cours:false} : {cours:true,vu:false}); }
  if(a==="strem"){ patchItem(id,{strem:!it.strem}); }
  if(navigator.vibrate) navigator.vibrate(8);
});
$$("#dock button").forEach(b=>b.onclick=()=>{ state.p=+b.dataset.p; ls.set("cine_p",state.p); animate=true; render(); $("#list").scrollTop=0; });
$$("#seg button").forEach(b=>b.onclick=()=>{ state.t=b.dataset.t; ls.set("cine_t",state.t); animate=true; render(); $("#list").scrollTop=0; });
$("#btnSort").onclick=()=>{ state.sort = state.sort==="az"?"recent":"az"; ls.set("cine_sort",state.sort); animate=true; render(); };

/* Feuilles modales */
function openSheet(n){ $("#scrim"+n).classList.add("open"); $("#sheet"+n).classList.add("open"); }
function closeSheets(){ $$(".scrim,.sheet").forEach(x=>x.classList.remove("open")); document.activeElement&&document.activeElement.blur(); }
$$(".scrim").forEach(s=>s.onclick=closeSheets);
$$("[data-close]").forEach(b=>b.onclick=closeSheets);

/* Ajout */
$("#fab").onclick=()=>{
  $("#addTitle").textContent = state.t==="film" ? `Ajouter un film · ${PROFILES[state.p]}` : `Ajouter une série · ${PROFILES[state.p]}`;
  $("#addInput").value=""; $("#addOk").disabled=true; openSheet("Add");
  setTimeout(()=>$("#addInput").focus(),350);
};
$("#addInput").oninput=e=>{ $("#addOk").disabled = !e.target.value.trim(); };
function submitAdd(){
  const v = $("#addInput").value.trim(); if(!v) return;
  const dup = Object.values(state.items).some(i=>i&&i.p===state.p&&i.t===state.t&&i.title.toLowerCase()===v.toLowerCase());
  if(dup){ toast("Ce titre est déjà dans la liste"); return }
  addItem(v); closeSheets();
}
$("#addOk").onclick=submitAdd;
$("#addInput").onkeydown=e=>{ if(e.key==="Enter") submitAdd(); };

/* Aléatoire */
const rnd = {p:state.p,t:state.t,pick:null,busy:false};
function rndRender(){
  $$("#rndP .opt").forEach(b=>b.classList.toggle("on",+b.dataset.p===rnd.p));
  $$("#rndT .opt").forEach(b=>b.classList.toggle("on",b.dataset.t===rnd.t));
}
$$("#rndP .opt").forEach(b=>b.onclick=()=>{rnd.p=+b.dataset.p;rndRender()});
$$("#rndT .opt").forEach(b=>b.onclick=()=>{rnd.t=b.dataset.t;rndRender()});
$("#btnRand").onclick=()=>{
  rnd.p=state.p; rnd.t=state.t; rnd.pick=null; rndRender();
  $("#rndRes").className="result glass"; $("#rndRes").innerHTML="<small>Prêt ?</small><strong>Choisis une liste puis tire au sort</strong>";
  $("#rndSeen").style.display="none"; $("#rndGo").textContent="Tirer au sort";
  openSheet("Rand");
};
$("#rndGo").onclick=()=>{
  if(rnd.busy) return;
  const pool = Object.entries(state.items).filter(([,i])=>i&&i.p===rnd.p&&i.t===rnd.t&&!i.vu);
  const res = $("#rndRes"), what = rnd.t==="film"?"film":"série";
  $("#rndSeen").style.display="none";
  if(!pool.length){
    res.className="result glass";
    res.innerHTML=`<small>${PROFILES[rnd.p]}</small><strong>Aucun ${what} à voir</strong>`; rnd.pick=null; return;
  }
  rnd.busy=true; res.className="result glass spin";
  let n=0; const total=14;
  const tick=()=>{
    const [,i]=pool[Math.floor(Math.random()*pool.length)];
    res.innerHTML=`<small>${PROFILES[rnd.p]}</small><strong>${esc(i.title)}</strong>`;
    if(++n<total){ setTimeout(tick,60+n*14) } else {
      const [id,f]=pool[Math.floor(Math.random()*pool.length)];
      rnd.pick=id; rnd.busy=false;
      res.className="result glass pop";
      res.innerHTML=`<small>Ce soir : ${what} de ${PROFILES[rnd.p]}</small><strong>${esc(f.title)}</strong>`;
      $("#rndSeen").style.display="block"; $("#rndGo").textContent="Relancer";
      if(navigator.vibrate) navigator.vibrate(20);
    }
  };
  tick();
};
$("#rndSeen").onclick=()=>{
  if(rnd.pick&&state.items[rnd.pick]){ patchItem(rnd.pick,{vu:true,cours:false}); toast("Marqué comme vu"); }
  closeSheets();
};

/* Paramètres */
$("#btnSet").onclick=()=>{ $("#fbUrl").value=dbUrl; renderSync(); openSheet("Set"); };
$("#fbSave").onclick=()=>{
  const u = cleanUrl($("#fbUrl").value);
  if(u && !/^https:\/\/.+/.test(u)){ toast("L’adresse doit commencer par https://"); return }
  ls.set("cine_fb",u);
  dbUrl = cleanUrl(FIREBASE_URL) || u;
  connect(); toast(dbUrl?"Synchronisation activée":"Mode local");
};

/* Toast */
let tt; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2400); }

/* ---------- Verrouillage du viewport ---------- */
["gesturestart","gesturechange","gestureend"].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
let lastTouch=0;
document.addEventListener("touchend",e=>{
  const now=Date.now();
  if(now-lastTouch<=300 && !e.target.closest("input")) e.preventDefault();
  lastTouch=now;
},{passive:false});
document.addEventListener("touchmove",e=>{
  if(e.touches.length>1) e.preventDefault();
  else if(!e.target.closest("#list")) e.preventDefault();
},{passive:false});
document.addEventListener("contextmenu",e=>e.preventDefault());
if(window.visualViewport){
  visualViewport.addEventListener("resize",()=>window.scrollTo(0,0));
}

/* ---------- Démarrage ---------- */
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(!ls.get("cine_theme","")) applyTheme(); });
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && dbUrl && (!es||es.readyState===2)) connect(); });
render(); connect();
requestAnimationFrame(moveInd);
</script>
</body>
</html>
